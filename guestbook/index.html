<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="../favicon-symbol.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>GUESTBOOK · 비밀독서구역 하이랑</title>
<meta name="description" content="하이랑 방명록 — 당신의 한 페이지를 남겨주세요.">
<meta name="theme-color" content="#FFF9EA">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lounge/lounge.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<link rel="modulepreload" crossorigin href="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js">
</head>
<body>
<div id="app" data-mode="overview">
  <canvas id="scene" aria-label="하이랑 방명록 라운지 3D 공간 — 의자, 글쓰기 책상, 방명록" role="img"></canvas>

  <!-- 공용 로고: 웹사이트·3D와 같은 자리·같은 크기 -->
  <a class="hl-glogo" href="../index.html?view=website" aria-label="하이랑 홈으로"><img src="assets/hirang-logo.png" alt="hirang" width="920" height="297"></a>
  <nav class="mini" aria-label="하이랑 메뉴">
    <a href="./" aria-current="page">GUESTBOOK</a>
    <a href="../index.html?view=website">홈</a>
    <a href="../experience/index.html" id="toRoom">비밀독서구역 3D</a>
  </nav>

  <!-- 장면 안 물건을 고르는 버튼(키보드·화면읽기용이자, 처음 화면의 안내) -->
  <div class="spots" id="spots" role="group" aria-label="방명록 라운지">
    <button type="button" data-go="sit">자리에 앉기</button>
  </div>
  <!-- 앉은 뒤: 어느 의자에서든 쓰거나 읽는다 -->
  <div class="spots seat-acts" id="seatActs" role="group" aria-label="자리에서 할 일" hidden>
    <button type="button" data-go="write">한 페이지 쓰기</button>
    <button type="button" data-go="read">공개된 페이지 읽기</button>
  </div>
  <div class="hint" id="hint" aria-hidden="true"></div>
  <p id="exploreHint" class="explore-hint" aria-hidden="true"><b>DRAG TO EXPLORE</b><span>바닥을 누르거나 휠로 걸어가고, 드래그로 둘러보세요</span></p>
  <div class="fade" id="fade" aria-hidden="true"></div>
  <button type="button" class="stand" id="stand" hidden>일어나기</button>

  <!-- 쓰기: 입력은 HTML, 같은 글이 책상 위 종이에 그대로 적힌다 -->
  <form class="sheet writer" id="writer" novalidate hidden>
    <label class="prompt" for="body">당신의 한 페이지를 남겨주세요.</label>
    <textarea id="body" maxlength="300" rows="6" required></textarea>
    <div class="count" aria-hidden="true"><span id="count">0</span> / 300</div>
    <div class="grp" role="radiogroup" aria-label="이름">
      <label class="rd"><input type="radio" name="identity" value="anonymous" checked><span>익명</span></label>
      <label class="rd"><input type="radio" name="identity" value="nickname"><span>닉네임</span></label>
      <label class="rd"><input type="radio" name="identity" value="realname"><span>실명</span></label>
    </div>
    <input type="text" id="name" maxlength="20" autocomplete="off" aria-label="이름" hidden>
    <label class="ck"><input type="checkbox" id="isPublic"><span>다른 방문객에게 글 공개하기</span></label>
    <label class="ck" id="showNameRow" hidden><input type="checkbox" id="showName"><span>이름도 함께 공개하기</span></label>
    <input type="text" name="website" id="website" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="err" role="alert"></p>
    <button type="submit" class="primary" id="submit">한 페이지 남기기</button>
  </form>

  <!-- 읽기: 방명록을 펼쳐 공개된 페이지만 -->
  <div class="reader" id="reader" hidden>
    <button type="button" class="turn" id="prev" aria-label="앞 페이지">←</button>
    <span class="rpos" id="rpos"></span>
    <button type="button" class="turn" id="next" aria-label="다음 페이지">→</button>
    <button type="button" class="ghost" id="closeBook">닫기</button>
  </div>
  <p class="sr" id="readText" aria-live="polite"></p>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <p class="preview-note" id="previewNote" hidden>미리보기 · 아직 페이지가 저장되지 않습니다</p>
</div>
<noscript><p class="nojs">이 방명록은 자바스크립트가 필요합니다.</p></noscript>
<script type="module" src="lounge/main.js"></script>
</body>
</html>
